name: CI

"on":
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/generate_agent_files.py --check
      - run: uv run python scripts/evaluate_agent_tasks.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >-
          uv run mypy apps/api/src packages/ontology_core/src
          packages/ontology_cli/src packages/ontology_mcp/src
      - run: uv run pytest apps/api/tests packages/ontology_core/tests tests

  cli-mcp:
    name: CLI and MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest packages/ontology_cli/tests packages/ontology_mcp/tests

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: uv run python scripts/generate_api_client.py --check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
