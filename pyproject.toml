[project]
name = "enterprise-ontology-workbench"
version = "0.1.0"
description = "Workspace for the Enterprise Ontology Workbench MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "enterprise-ontology-api",
  "ontology-cli",
  "ontology-core",
  "ontology-mcp",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.14.1,<2",
  "pytest>=8.3.4,<9",
  "pyyaml>=6.0.2,<7",
  "ruff>=0.9.6,<1",
  "types-pyyaml>=6.0.12.20241230,<7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/*"]

[tool.uv.sources]
enterprise-ontology-api = { workspace = true }
ontology-cli = { workspace = true }
ontology-core = { workspace = true }
ontology-mcp = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["apps/api/tests", "packages", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
