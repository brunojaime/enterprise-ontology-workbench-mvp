[project]
name = "enterprise-ontology-api"
version = "0.1.0"
description = "FastAPI adapter for the Enterprise Ontology Workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.7,<1",
  "ontology-core",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
ontology-core = { workspace = true }
